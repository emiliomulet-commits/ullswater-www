<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from './vendor/GLTFLoader.js';
import {RoomEnvironment} from './vendor/RoomEnvironment.js';

const OFF = 2.5, TOTAL = 229;
const CUES = await fetch('media/cues.json').then(r => r.json());
const EU = await fetch('media/europe.json').then(r => r.json());
const T = k => CUES[k] + OFF;               // tiempo de vídeo de cada marca de la locución
const q = new URLSearchParams(location.search);
const RENDER = q.get('render') === '1';
if(q.get('embed')) document.body.classList.add('embed');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- utilidades SVG */
const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
function el(tag, at = {}, parent){ const e = document.createElementNS(NS, tag); for(const k in at){ if(k === 'text') e.textContent = at[k]; else e.setAttribute(k, at[k]); } if(parent) parent.appendChild(e); return e; }
const G = (parent, at = {}) => el('g', at, parent);
const cam = $('#cam'), top = $('#top');
for(let x = 0; x <= 1600; x += 80) el('path', {d:`M${x} 0V900`}, $('#grid'));
for(let y = 0; y <= 900; y += 80) el('path', {d:`M0 ${y}H1600`}, $('#grid'));
const GOLD = '#C9A227', GOLD2 = '#F3D36B', NAVY = '#0B1F3A', RED = '#E5484D', TEAL = '#1B998B', INK = '#C9D6E8';
const MONT = 'Montserrat,sans-serif';
function txt(parent, x, y, s, size, at = {}){ return el('text', Object.assign({x, y, 'font-size':size, fill:'#fff', text:s}, at), parent); }
function typeTo(e, dur){ const full = e.getAttribute('data-full') || e.textContent; e.setAttribute('data-full', full); const o = {n:0}; e.textContent = ''; return gsap.to(o, {n:full.length, duration:dur, ease:'none', onUpdate:() => { e.textContent = full.slice(0, Math.round(o.n)); }}); }
function draw(p, d, ease = 'power2.out'){ const L = p.getTotalLength(); gsap.set(p, {strokeDasharray:L, strokeDashoffset:L}); return gsap.to(p, {strokeDashoffset:0, duration:d, ease}); }
function counter(e, from, to, d, fmt){ const o = {v:from}; return gsap.to(o, {v:to, duration:d, ease:'power2.out', onUpdate:() => { e.textContent = fmt(o.v); }}); }
function img(parent, href, x, y, w, at = {}){ return el('image', Object.assign({href, x, y, width:w, height:w}, at), parent); }

/* cámara virtual */
const C = {x:800, y:450, s:1};
const applyCam = () => cam.setAttribute('transform', `translate(${800 - C.x*C.s} ${450 - C.y*C.s}) scale(${C.s})`);
const camTo = (x, y, s, d = 1.2, ease = 'power3.inOut') => gsap.to(C, {x, y, s, duration:d, ease, onUpdate:applyCam});
applyCam();

/* ---------------- línea de tiempo maestra (segundos = segundos de la banda sonora) */
const tl = gsap.timeline({paused:true, defaults:{ease:'power3.out'}});
const at = (t, tw) => tl.add(tw, t);
const set = (t, target, vars) => tl.set(target, vars, t);
const SCENES = [
 ['s1', 'La señal ignorada', 0], ['s2', 'El coste', T('s2')], ['s3', 'Por qué no llega', T('s3')], ['s4', 'ProAct-Edge', T('s4')],
 ['s5', 'Cómo funciona', T('s5')], ['s6', 'Cuatro innovaciones', T('s6')], ['s7', 'Objetivos', T('s7')], ['s8', 'Seis pilotos', T('s8')],
 ['s9', 'El consorcio', T('s9')], ['s10', 'Únete', T('s10')]];
SCENES.forEach(([k, , t]) => tl.addLabel(k, t));

/* ---------------- la onda (motivo recurrente) */
const W = {amp:0, chaos:0, x1:0, y:450, op:0, red:0, w:3};
const wave = el('path', {fill:'none', stroke:GOLD, 'stroke-width':3, 'stroke-linecap':'round', filter:'url(#glow)', opacity:0}, top);
function waveD(t){
  let d = ''; const N = 160;
  for(let i = 0; i <= N; i++){
    const x = i / N * W.x1; const u = x / 1600;
    const env = Math.sin(Math.PI * Math.min(1, u * 1.0 + .0)) ** .6;
    const base = Math.sin(u * 18 + t * 2.2) * .6 + Math.sin(u * 7 - t * 1.3) * .4;
    const ch = W.chaos * (Math.sin(u * 61 + t * 9) * .7 + Math.sin(u * 131 - t * 17) * .5) * (.4 + .6 * Math.abs(Math.sin(t * 6 + u * 9)));
    d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + (W.y + (base + ch) * W.amp * env).toFixed(1);
  }
  return d;
}
function paintWave(t){
  if(W.op <= 0.001){ wave.setAttribute('opacity', 0); return; }
  wave.setAttribute('d', waveD(t)); wave.setAttribute('opacity', W.op);
  const c = gsap.utils.interpolate(GOLD, RED, W.red); wave.setAttribute('stroke', c); wave.setAttribute('stroke-width', W.w);
}

/* ---------------- vídeo de archivo */
const CLIPS = [
 {id:'c1', src:'media/c1.mp4', start:3.9, end:11.9, from:0, full:true},
 {id:'ce', src:'media/ce.mp4', start:14.25, end:16.0, from:3.0, full:true},
 {id:'c2', src:'media/c2.mp4', start:T('maqavisan') - .3, end:T('s5') - .2, from:.5, full:true},
 {id:'c3', src:'media/c3.mp4', start:T('siente') + .2, end:T('siente') + 3.2, from:0, full:true},
 {id:'c7', src:'media/c7.mp4', start:T('entiende') + .1, end:T('entiende') + 3.1, from:1, full:true},
 {id:'c6', src:'media/c6.mp4', start:T('esp') + .3, end:T('nl') - .2, from:1, win:[70, 400, 380, 214]},
 {id:'c5', src:'media/c5.mp4', start:T('nl') + .3, end:T('tr') - .2, from:2, win:[900, 160, 380, 214]},
 {id:'c4', src:'media/c4.mp4', start:T('tr') + .1, end:T('pt') - .1, from:2, win:[1230, 640, 340, 191]},
];
const clipLayer = $('#clips');
CLIPS.forEach(c => {
  const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = RENDER ? `webm/${c.id}.webm` : c.src;
  v.className = c.full ? 'full' : 'win';
  if(c.win){ const [x, y, w, h] = c.win; Object.assign(v.style, {left:x/16 + '%', top:y/9 + '%', width:w/16 + '%', height:h/9 + '%'}); }
  c.ok = true; v.onerror = () => { c.ok = false; };
  clipLayer.insertBefore(v, $('#veil')); c.v = v;
});
function clipOn(c){ // opacidad del clip dentro de la línea de tiempo
  tl.fromTo(c.v, {opacity:0}, {opacity:1, duration:.35, ease:'none', immediateRender:false}, c.start)
    .to(c.v, {opacity:0, duration:.35, ease:'none'}, c.end - .35);
  if(c.full){ tl.to('#veil', {opacity:1, duration:.35}, c.start).to('#veil', {opacity:0, duration:.35}, c.end - .35);
              tl.to('#grain', {opacity:.07, duration:.35}, c.start).to('#grain', {opacity:0, duration:.35}, c.end - .35); }
}
CLIPS.forEach(clipOn);
let playing = false;
function syncClips(t){
  for(const c of CLIPS){
    const on = c.ok && t >= c.start - .4 && t < c.end;
    const v = c.v;
    if(!on){ if(!v.paused) v.pause(); continue; }
    const want = c.from + Math.max(0, t - c.start);
    if(Math.abs(v.currentTime - want) > .3 || (!playing && Math.abs(v.currentTime - want) > .04)){ try{ v.currentTime = want; }catch(e){} }
    if(playing && v.paused && !RENDER) v.play().catch(() => {});
    if(!playing && !v.paused) v.pause();
  }
}

/* ---------------- engranaje 3D (Envato · three.js) */
const GL = {x:800, y:400, s:1, o:0, size:520, cam:0};
const glc = $('#gl');
const renderer = new THREE.WebGLRenderer({canvas:glc, antialias:true, alpha:true, preserveDrawingBuffer:RENDER});
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene3 = new THREE.Scene(); const pm = new THREE.PMREMGenerator(renderer);
scene3.environment = pm.fromScene(new RoomEnvironment(), .04).texture;
const cam3 = new THREE.PerspectiveCamera(28, 1, .1, 100);
const key = new THREE.DirectionalLight(0xffe2a0, 2.4); key.position.set(3, 4, 5); scene3.add(key);
const rim = new THREE.DirectionalLight(0x8fb4ff, 1.4); rim.position.set(-4, 2, -3); scene3.add(rim);
let gear = null;
fetch('media/gear.json').then(r => r.json()).then(j => { const bin = Uint8Array.from(atob(j.glb), c => c.charCodeAt(0)).buffer; new GLTFLoader().parse(bin, '', g => { gear = g.scene; const b = new THREE.Box3().setFromObject(gear); const c = b.getCenter(new THREE.Vector3()); const z = b.getSize(new THREE.Vector3()).length(); gear.position.sub(c); const piv = new THREE.Group(); piv.add(gear); scene3.add(piv); gear = piv; cam3.position.set(0, z * .08, z * 1.75); cam3.lookAt(0, 0, 0); }); });
function layoutGL(){ const fw = $('#frame').clientWidth, u = fw / 1600, k = GL.cam ? C.s : 1, px = GL.size * GL.s * k * u;
  const sx = GL.cam ? 800 - C.x * C.s + GL.x * C.s : GL.x, sy = GL.cam ? 450 - C.y * C.s + GL.y * C.s : GL.y; const dpr = Math.min(2, devicePixelRatio || 1);
  if(glc.width !== Math.round(px * dpr)){ renderer.setPixelRatio(dpr); renderer.setSize(px, px, false); }
  Object.assign(glc.style, {width:px + 'px', height:px + 'px', left:(sx * u - px / 2) + 'px', top:(sy * u - px / 2) + 'px', opacity:GL.o}); }
function paintGL(t){ if(GL.o <= .001 || !gear){ glc.style.opacity = 0; return; } layoutGL(); gear.rotation.y = Math.sin(t * .55) * .28; gear.rotation.x = Math.sin(t * .37) * .08; gear.position.y = Math.sin(t * 1.1) * .02; renderer.render(scene3, cam3); }

/* ============ ESCENA 1 · La señal ignorada (0 – s2) */
const b = $('#black');
at(0, gsap.to(b, {opacity:0, duration:1.4, ease:'power1.inOut'}));
at(.3, gsap.to(W, {op:1, duration:.4}));
at(.3, gsap.to(W, {x1:1600, amp:16, duration:2.6, ease:'power2.inOut'}));
at(.4, camTo(800, 450, 1.06, 9, 'none'));
const s1 = G(top, {});
const L1 = [['Vibra distinto.', T('vibra') - .1], ['Suena distinto.', CUES.suena ? 6.22 + OFF : 8.7], ['Se calienta.', 7.64 + OFF]];
L1.forEach(([s, t], i) => { const e = txt(s1, 120, 660 + i * 70, s, 54, {'font-family':MONT, 'font-weight':800, fill:i === 2 ? GOLD : '#fff', opacity:0}); at(t, gsap.fromTo(e, {opacity:0, y:18}, {opacity:1, y:0, duration:.45})); at(11.8, gsap.to(e, {opacity:0, duration:.4})); });
at(3.9, gsap.to(W, {y:530, duration:1.2}));
at(6.5, gsap.to(W, {amp:34, chaos:.35, duration:3}));
const nadie = txt(s1, 800, 360, 'Nadie la escucha.', 64, {'font-family':MONT, 'font-weight':800, 'text-anchor':'middle', opacity:0});
at(11.95, gsap.to(W, {y:450, amp:46, chaos:.7, duration:1.2}));
at(12.2, gsap.fromTo(nadie, {opacity:0, y:10}, {opacity:1, y:0, duration:.5}));
at(14.0, gsap.to(nadie, {opacity:0, duration:.3}));
at(T('hasta') - .4, gsap.to(W, {red:1, amp:80, chaos:1.4, duration:.6}));
const dim = el('rect', {width:1600, height:900, fill:'#02060C', opacity:0}, top);
const hasta = txt(top, 800, 470, 'Hasta que la línea se para.', 74, {'font-family':MONT, 'font-weight':900, 'text-anchor':'middle', opacity:0});
const parar = 13.24 + OFF + .25;
at(parar - .02, gsap.to('#flash', {opacity:.85, duration:.05, ease:'none'}));
at(parar + .05, gsap.to('#flash', {opacity:0, duration:.5, ease:'power2.out'}));
at(parar, gsap.to(W, {op:0, duration:.08}));
set(parar, dim, {opacity:.92});
set(parar, hasta, {opacity:1});
const redline = el('rect', {x:310, y:500, width:0, height:8, rx:4, fill:RED}, top);
at(parar + .2, gsap.to(redline, {attr:{width:980}, duration:.5, ease:'power2.inOut'}));
at(T('s2') - .5, gsap.to([hasta, redline], {opacity:0, duration:.5}));
at(T('s2') - .5, gsap.to(dim, {opacity:0, duration:.8}));

/* ============ ESCENA 2 · El coste */
const s2 = G(cam, {opacity:0});
at(T('s2') - .2, gsap.to(s2, {opacity:1, duration:.4}));
at(T('s2'), camTo(800, 450, 1, .1));
txt(s2, 800, 150, 'EL COSTE DE UNA PARADA', 26, {'text-anchor':'middle', fill:GOLD, 'font-weight':700, 'letter-spacing':6});
const big = txt(s2, 800, 470, '0 %', 260, {'text-anchor':'middle', 'font-family':MONT, 'font-weight':900, fill:'#fff'});
const bigSub = txt(s2, 800, 560, 'de los ingresos de las mayores empresas del mundo', 34, {'text-anchor':'middle', fill:INK, opacity:0});
const gl2 = el('circle', {cx:800, cy:390, r:300, fill:'url(#glowG)', opacity:0}, s2); s2.insertBefore(gl2, s2.firstChild);
at(T('once') - .4, counter(big, 0, 11, 1.1, v => Math.round(v) + ' %'));
at(T('once') + .6, gsap.to(gl2, {opacity:1, duration:.3, yoyo:true, repeat:1}));
at(T('once') + .3, gsap.to(bigSub, {opacity:1, duration:.6}));
const fac = G(s2, {opacity:0});
const facs = [0, 1, 2].map(i => { const g = G(fac, {}); img(g, 'media/factory.png', 900 + i * 210, 330, 200); const r = el('g', {opacity:0}, g); el('circle', {cx:1080 + i * 210 - 10, cy:350, r:26, fill:RED}, r); txt(r, 1070 + i * 210, 360, '!', 34, {'text-anchor':'middle', 'font-weight':800}); return {g, r}; });
const facT = txt(s2, 1110, 600, '2 de cada 3 plantas', 44, {'text-anchor':'middle', 'font-family':MONT, 'font-weight':800, opacity:0});
const facT2 = txt(s2, 1110, 645, 'mantienen por calendario o tras la avería', 27, {'text-anchor':'middle', fill:INK, opacity:0});
at(T('dos_de') - .2, gsap.to(big, {attr:{x:420, y:440, 'font-size':200}, duration:.9}));
at(T('dos_de') - .2, gsap.to(bigSub, {attr:{x:420, y:520, 'font-size':24}, duration:.9}));

/* ---------------- reloj: la banda sonora manda */
const audio = new Audio('media/banda.mp3'); audio.preload = 'auto';
let clock = 0, last = performance.now(), useAudio = false;
function now(){ return useAudio ? audio.currentTime : clock; }
function frame(){
  const n = performance.now(); if(playing && !useAudio) clock = Math.min(TOTAL, clock + (n - last) / 1000); last = n;
  const t = now(); tl.seek(t, false); paintWave(t); paintGL(t); syncClips(t); paintUI(t);
  if(playing && t >= TOTAL - .02){ pause(); if(window.parent !== window) try{ parent.postMessage({proactedge:'fin'}, '*'); }catch(e){} }
}
if(!RENDER) gsap.ticker.add(frame);
function play(withSound){ if(withSound !== undefined) useAudio = withSound; if(now() >= TOTAL - .05) seek(0);
  playing = true; document.body.classList.add('playing');
  if(useAudio){ audio.currentTime = clock; audio.play().catch(() => { useAudio = false; }); } }
function pause(){ playing = false; if(useAudio){ clock = audio.currentTime; audio.pause(); } }
function seek(t){ clock = Math.max(0, Math.min(TOTAL, t)); if(useAudio) audio.currentTime = clock; }
$('#startBtn').onclick = e => { e.stopPropagation(); useAudio = true; play(true); };
$('#play').onclick = () => playing ? pause() : play(useAudio || true);
$('#mute').onclick = () => { audio.muted = !audio.muted; $('#mi').setAttribute('d', audio.muted ? 'M4 9v6h4l5 4V5L8 9zM17 9l5 6M22 9l-5 6' : 'M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11'); };
$('#fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
const sc = $('#scenes');
SCENES.forEach(([k, n, t], i) => { const bt = document.createElement('button'); bt.type = 'button'; bt.innerHTML = `<b>${i + 1}</b><span>${n}</span><i></i>`; bt.title = `${i + 1} · ${n}`; bt.onclick = () => { seek(t); if(!playing) play(true); }; sc.appendChild(bt); });
const sb = [...sc.children], fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
function paintUI(t){
  sb.forEach((bt, i) => { const a = SCENES[i][2], z = i + 1 < SCENES.length ? SCENES[i + 1][2] : TOTAL; bt.classList.toggle('on', t >= a && t < z); bt.querySelector('i').style.width = (t >= z ? 100 : t <= a ? 0 : (t - a) / (z - a) * 100) + '%'; });
  $('#time').textContent = fmt(t) + ' / ' + fmt(TOTAL);
  $('#pi').setAttribute('d', playing ? 'M7 5h4v14H7zM13 5h4v14h-4z' : 'M8 5v14l11-7z');
}
document.addEventListener('keydown', e => {
  if(e.key === ' '){ e.preventDefault(); playing ? pause() : play(true); }
  else if(e.key === 'ArrowRight'){ const t = now(); const nx = SCENES.find(s => s[2] > t + .5); if(nx) seek(nx[2]); }
  else if(e.key === 'ArrowLeft'){ const t = now(); const pv = [...SCENES].reverse().find(s => s[2] < t - 1.5); seek(pv ? pv[2] : 0); }
  else if(e.key === 'f' || e.key === 'F') $('#fs').onclick();
  else if(e.key === 'Escape' && window.parent !== window && !document.fullscreenElement) try{ parent.postMessage({proactedge:'cerrar'}, '*'); }catch(e){}
});
let idleT; document.addEventListener('mousemove', () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => { if(playing) document.body.classList.add('idle'); }, 2500); });
$('#wrap').addEventListener('click', () => { if(document.body.classList.contains('playing')) playing ? pause() : play(); });
if(q.get('auto') === '1' && !RENDER){ useAudio = true; play(true); }
if(reduced && !RENDER){ seek(T('lema') + 2); }

/* ---------------- render fotograma a fotograma (exportación a mp4) */
window.PE = {TOTAL, tl, async renderAt(t){
  playing = false; clock = t; tl.seek(t, false); paintWave(t);
  const waits = [];
  for(const c of CLIPS){ const on = c.ok && t >= c.start - .05 && t < c.end; if(on){ const want = c.from + Math.max(0, t - c.start); if(Math.abs(c.v.currentTime - want) > .001){ waits.push(new Promise(r => { const f = () => { c.v.removeEventListener('seeked', f); r(); }; c.v.addEventListener('seeked', f); c.v.currentTime = want; setTimeout(r, 1500); })); } } }
  await Promise.all(waits); paintGL(t); return true; }, ready:() => !!gear};
</script>
