name: Ayudas IA (borrador)
# Generates the AI fichas of the pilot grants (content/ayudas_ia/pilot.txt) on the draft branch and commits them there.
# Nothing is deployed: www is only published from main.
on:
  push:
    branches: ["drafts/ayudas-ia"]
    paths: ["scripts/ayudas_ia.py", "content/ayudas_ia/pilot.txt", ".github/workflows/ayudas-ia-draft.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ayudas-ia-draft
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4 pypdf json-repair
      - name: Generate the pilot fichas
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || echo "::warning::ANTHROPIC_API_KEY is not available to this workflow"
          python scripts/ayudas_ia.py
      - name: Commit the fichas to the draft branch
        run: |
          git config user.name "ullswater-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/ayudas_ia
          git diff --cached --quiet || (git commit -m "Pilot AI fichas [skip ci]" && git push)
